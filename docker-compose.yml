version: '3.8'

services:
  app:
    build: .
    container_name: multi-agent-knowledge-system
    ports:
      - "8000:8000"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - MODEL_NAME=gemini-1.5-flash
      - EMBEDDING_MODEL=models/text-embedding-004
      - TEMPERATURE=0.1
      - FAISS_INDEX_PATH=app/db/faiss_index
      - CHUNK_SIZE=800
      - CHUNK_OVERLAP=100
      - TOP_K_RESULTS=5
    volumes:
      # Persist uploaded documents
      - ./data/documents:/app/data/documents
      # Persist FAISS index
      - ./app/db/faiss_index:/app/app/db/faiss_index
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

# Optional: Add a volume for persistent storage
volumes:
  documents:
  faiss_index:
